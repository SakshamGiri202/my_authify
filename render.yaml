services:
  - type: web
    name: my-authify-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
